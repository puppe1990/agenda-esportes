name: ge-sync

# The app schedules its own sync every 15 minutes (lib/sync_scheduler.rb)
# because GitHub's schedule fires 6-8h late on this repo. This workflow is
# kept as a second source: it warms a cold app and reports drift. It is
# not the only thing keeping the snapshot fresh anymore.
on:
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Pull the GE window into the live app
        env:
          GE_SYNC_TOKEN: ${{ secrets.GE_SYNC_TOKEN }}
        run: |
          test -n "$GE_SYNC_TOKEN"
          curl -fsS -H "Authorization: Bearer ${GE_SYNC_TOKEN}" \
            "https://agenda-esportes.sites.gestaobem.com/interno/ge-sync"
