<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>OG · Agenda de esportes</title>
<style>
@font-face{
  font-family:"Instrument Serif";
  src:url("fonts/instrument-serif-400.woff2") format("woff2");
  font-weight:400;font-style:normal;font-display:block;
}
@font-face{
  font-family:"IBM Plex Sans";
  src:url("fonts/ibm-plex-sans-400.woff2") format("woff2");
  font-weight:400;font-style:normal;font-display:block;
}
@font-face{
  font-family:"IBM Plex Sans";
  src:url("fonts/ibm-plex-sans-500.woff2") format("woff2");
  font-weight:500;font-style:normal;font-display:block;
}
@font-face{
  font-family:"IBM Plex Mono";
  src:url("fonts/ibm-plex-mono-400.woff2") format("woff2");
  font-weight:400;font-style:normal;font-display:block;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1200px;height:630px;overflow:hidden;background:#0b0e14}
#og{
  width:1200px;height:630px;position:relative;overflow:hidden;
  background:#0b0e14;color:#e8edf5;
  font-family:"IBM Plex Sans", ui-sans-serif, system-ui, sans-serif;
}
#og::before{
  content:"";position:absolute;inset:0;pointer-events:none;
  background:
    radial-gradient(560px 320px at 88% -8%, rgba(110,255,148,.16), transparent 64%),
    linear-gradient(180deg, #10141c 0%, #0b0e14 46%, #080a10 100%);
}
.grain{
  position:absolute;inset:0;pointer-events:none;opacity:.045;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
}
.rule{
  position:absolute;left:0;top:0;bottom:0;width:4px;background:#6eff94;
}
.frame{
  position:relative;z-index:1;height:630px;
  padding:44px 52px 36px 56px;
  display:flex;flex-direction:column;justify-content:space-between;
}
.top,.foot,.kicker,.host,.dow,.count,.pill{
  font-family:"IBM Plex Mono", ui-monospace, Menlo, monospace;
}
.top{
  display:flex;align-items:baseline;justify-content:space-between;
  font-size:13px;letter-spacing:.18em;text-transform:uppercase;
}
.kicker{color:#6eff94}
.host{color:#5c6474;letter-spacing:.08em}
.body{
  display:grid;grid-template-columns:1fr 680px;gap:32px;align-items:center;
}
h1{
  font-family:"Instrument Serif", "Iowan Old Style", Georgia, serif;
  font-size:76px;font-weight:400;line-height:.9;letter-spacing:-.03em;
  max-width:8ch;
}
.lead{
  margin-top:18px;max-width:16ch;
  font-size:24px;line-height:1.3;color:#8b93a7;
}
.board{
  background:#141821;
  border:1px solid #1e2430;
  border-radius:22px;
  padding:18px;
  display:grid;gap:16px;
}
.strip{
  display:grid;
  grid-template-columns:repeat(7,minmax(0,1fr));
  gap:6px;
}
.day{
  min-width:0;min-height:124px;
  padding:12px 8px 14px;
  background:#1a1f2a;color:#e8edf5;
  border-radius:16px;
  display:flex;flex-direction:column;justify-content:space-between;gap:8px;
}
.dow{
  font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#8b93a7;
}
.num{
  font-size:34px;font-weight:500;letter-spacing:-.04em;line-height:1;
  font-variant-numeric:tabular-nums;
}
.count{
  font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#5c6474;
  display:flex;align-items:center;gap:6px;
  min-height:1.1em;
}
.day.sat .count{color:#c9a07a}
.day.on{background:#6eff94;color:#0b1210}
.day.on .dow,.day.on .count{color:inherit;opacity:.72}
.live{
  width:6px;height:6px;border-radius:50%;background:#0b1210;flex:0 0 auto;
}
.pills{display:flex;flex-wrap:wrap;gap:6px}
.pill{
  display:inline-flex;align-items:center;gap:8px;
  padding:8px 13px;border-radius:999px;
  background:#1a1f2a;color:#c5ccd8;
  font-size:12px;font-weight:500;letter-spacing:.04em;text-transform:uppercase;
  font-family:"IBM Plex Sans", ui-sans-serif, system-ui, sans-serif;
}
.pill b{
  font-family:"IBM Plex Mono", ui-monospace, Menlo, monospace;
  font-weight:400;font-size:11px;color:#8b93a7;
  background:#10141c;border-radius:999px;padding:1px 6px;
}
.pill.on{background:#6eff94;color:#0b1210}
.pill.on b{background:rgba(11,18,16,.16);color:inherit}
.foot{
  display:flex;align-items:center;justify-content:space-between;
  font-size:13px;letter-spacing:.04em;color:#5c6474;
}
.foot b{color:#6eff94;font-weight:400}
</style>
</head>
<body>
<div id="og">
  <span class="rule" aria-hidden="true"></span>
  <div class="grain" aria-hidden="true"></div>
  <div class="frame">
    <div class="top">
      <p class="kicker">Agenda · BRT</p>
      <p class="host">agenda-esportes.sites.gestaobem.com</p>
    </div>
    <div class="body">
      <div>
        <h1>Agenda de esportes</h1>
        <p class="lead">Clica no jogo. Grava na agenda.</p>
      </div>
      <div class="board">
        <div class="strip">
          <div class="day"><span class="dow">seg</span><span class="num">2</span><span class="count"></span></div>
          <div class="day"><span class="dow">ter</span><span class="num">3</span><span class="count"></span></div>
          <div class="day"><span class="dow">qua</span><span class="num">4</span><span class="count"></span></div>
          <div class="day"><span class="dow">qui</span><span class="num">5</span><span class="count"></span></div>
          <div class="day"><span class="dow">sex</span><span class="num">6</span><span class="count"></span></div>
          <div class="day sat"><span class="dow">sáb</span><span class="num">7</span><span class="count"></span></div>
          <div class="day on"><span class="dow">dom</span><span class="num">8</span><span class="count"><span class="live" aria-hidden="true"></span>18 jogos</span></div>
        </div>
        <div class="pills">
          <span class="pill on">Todos <b>18</b></span>
          <span class="pill">Futebol <b>7</b></span>
          <span class="pill">NFL <b>6</b></span>
          <span class="pill">NBA <b>4</b></span>
          <span class="pill">Automobilismo <b>1</b></span>
        </div>
      </div>
    </div>
    <p class="foot"><span>Futebol · NFL · NBA · automobilismo</span><b>Clica. Grava. BRT.</b></p>
  </div>
</div>
</body>
</html>
